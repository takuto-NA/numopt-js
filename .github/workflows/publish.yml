name: npm publish (trusted)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_ref:
        description: 'Git ref to publish (e.g., v0.3.0)'
        required: true
        default: 'v0.4.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)

    steps:
    - name: Checkout publish ref
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref || inputs.publish_ref }}

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20.x'
        registry-url: https://registry.npmjs.org
        cache: 'npm'

    - name: Upgrade npm (Trusted Publishing requires newer npm)
      run: |
        npm --version
        npm install -g npm@^11.5.1
        npm --version

    - name: Verify npm registry config
      run: |
        npm config get registry
        npm config list --location=project || true

    - name: Install dependencies
      run: npm ci

    - name: Work around npm optional dependency bug for Rollup natives
      run: npm install --no-save --no-package-lock @rollup/rollup-linux-x64-gnu

    - name: Verify ref matches package.json version
      run: |
        node -e "const v=require('./package.json').version; const ref='${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref || inputs.publish_ref }}'.replace(/^refs\\//,'').replace(/^tags\\//,''); const tag=ref.replace(/^v/,''); if(v!==tag){console.error(`package.json version ${v} does not match ref ${ref}`); process.exit(1);} console.log('Version OK:', v);"

    - name: Run tests
      run: npm test

    - name: Smoke test packed artifact (npm pack)
      run: npm run smoke:pack

    - name: Publish to npm (Trusted Publishing)
      run: npm publish --provenance --access public

