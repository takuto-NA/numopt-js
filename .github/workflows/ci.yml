name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Work around npm optional dependency bug for Rollup natives
      run: npm install --no-save --no-package-lock @rollup/rollup-linux-x64-gnu

    - name: Typecheck
      run: npm run typecheck

    - name: Run tests
      run: npm test

    - name: Smoke test packed artifact (npm pack)
      if: matrix.node-version == '20.x'
      run: npm run smoke:pack

    - name: Build
      if: matrix.node-version != '20.x'
      run: npm run build

    - name: Generate TypeDoc
      if: matrix.node-version == '20.x'
      run: npm run docs
